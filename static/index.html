<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Emails - Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .preview-container { min-height: 400px; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: white; }
        .editor-textarea { font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">Panel de Emails</h1>
                <p class="text-slate-500">Gestiona y envía plantillas profesionales con Resend</p>
            </div>
            <div class="hidden md:block">
                <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-medium">
                    <i class="fas fa-circle text-[10px] mr-1"></i> API Conectada
                </span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Formulario de Envío -->
            <div class="glass p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fas fa-paper-plane mr-2 text-blue-600"></i> Configuración del Envío
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Destinatario (Email)</label>
                        <input type="email" id="to" placeholder="ejemplo@correo.com" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Remitente (Nombre <email>)</label>
                        <input type="text" id="sender" placeholder="Tu Nombre <onboarding@resend.dev>" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                        <p class="text-xs text-slate-400 mt-1">Usa el dominio verificado en Resend o onboarding@resend.dev para pruebas.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Asunto</label>
                        <input type="text" id="subject" placeholder="Asunto del correo" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Plantilla HTML/CSS</label>
                        <textarea id="html_content" rows="12" class="editor-textarea w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-sm" placeholder="<html>...</html>"></textarea>
                    </div>

                    <div class="flex gap-4 pt-2">
                        <button onclick="updatePreview()" class="flex-1 px-6 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition flex items-center justify-center">
                            <i class="fas fa-eye mr-2"></i> Vista Previa
                        </button>
                        <button onclick="sendEmail()" id="sendBtn" class="flex-1 px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center justify-center">
                            <i class="fas fa-paper-plane mr-2"></i> Enviar Email
                        </button>
                    </div>
                </div>
            </div>

            <!-- Vista Previa -->
            <div class="flex flex-col">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fas fa-desktop mr-2 text-slate-600"></i> Vista Previa en Tiempo Real
                </h2>
                <div id="preview" class="preview-container shadow-inner overflow-auto p-4">
                    <div class="flex items-center justify-center h-full text-slate-400 italic">
                        Escribe HTML para ver la vista previa aquí...
                    </div>
                </div>
                
                <!-- Notificaciones -->
                <div id="status" class="mt-6 hidden">
                    <div id="statusContent" class="p-4 rounded-xl flex items-center">
                        <!-- Dinámico -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Plantilla por defecto
        const defaultTemplate = `<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; }
        .header { background: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 20px; line-height: 1.6; color: #333; }
        .footer { text-align: center; font-size: 12px; color: #777; margin-top: 20px; }
        .button { display: inline-block; padding: 12px 24px; background: #2563eb; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>¡Bienvenido!</h1>
        </div>
        <div class="content">
            <p>Hola,</p>
            <p>Este es un ejemplo de plantilla profesional enviada desde tu nuevo <strong>Panel de Emails</strong>.</p>
            <p>Puedes editar este código HTML y ver los cambios en tiempo real.</p>
            <div style="text-align: center; margin: 30px 0;">
                <a href="#" class="button">Confirmar Registro</a>
            </div>
            <p>Saludos,<br>El equipo de Soporte</p>
        </div>
        <div class="footer">
            &copy; 2024 Tu Empresa. Todos los derechos reservados.
        </div>
    </div>
</body>
</html>`;

        document.getElementById('html_content').value = defaultTemplate;

        function updatePreview() {
            const html = document.getElementById('html_content').value;
            const preview = document.getElementById('preview');
            preview.innerHTML = html;
        }

        async function sendEmail() {
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            const statusContent = document.getElementById('statusContent');
            
            const data = {
                to: document.getElementById('to').value,
                sender: document.getElementById('sender').value,
                subject: document.getElementById('subject').value,
                html_content: document.getElementById('html_content').value
            };

            if (!data.to || !data.sender || !data.subject || !data.html_content) {
                showStatus('Por favor completa todos los campos', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando...';

            try {
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('¡Email enviado con éxito! ID: ' + result.id, 'success');
                } else {
                    showStatus('Error: ' + (result.detail || 'No se pudo enviar'), 'error');
                }
            } catch (error) {
                showStatus('Error de conexión con el servidor', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Enviar Email';
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            const statusContent = document.getElementById('statusContent');
            
            status.classList.remove('hidden');
            if (type === 'success') {
                statusContent.className = 'p-4 rounded-xl flex items-center bg-green-100 text-green-700 border border-green-200';
                statusContent.innerHTML = `<i class="fas fa-check-circle mr-3 text-xl"></i> <span>${message}</span>`;
            } else {
                statusContent.className = 'p-4 rounded-xl flex items-center bg-red-100 text-red-700 border border-red-200';
                statusContent.innerHTML = `<i class="fas fa-exclamation-circle mr-3 text-xl"></i> <span>${message}</span>`;
            }
            
            setTimeout(() => {
                status.classList.add('hidden');
            }, 5000);
        }

        // Inicializar vista previa
        updatePreview();
    </script>
</body>
</html>
